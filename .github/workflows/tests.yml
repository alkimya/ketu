name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Keep manual trigger as fallback

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]" || pip install -e .
        pip install pytest pytest-cov

    - name: Run tests
      run: |
        pytest tests/ -v --cov=ketu --cov-report=term-missing

    - name: Type check
      if: matrix.python-version == '3.11'
      run: |
        pip install mypy
        mypy ketu/ --strict

    - name: Check coverage threshold
      if: matrix.python-version == '3.13'
      run: |
        pytest tests/ --cov=ketu --cov-fail-under=70 -q

    - name: Doc coverage gate (interrogate ≥95%)
      if: matrix.python-version == '3.13'
      run: |
        python -m interrogate ketu/

    # Phase 20 (OPS-02 finalization): remove `continue-on-error: true` and
    # the `"GL01"` suppression in `[tool.numpydoc_validation].checks` to
    # flip this gate to blocking (per Phase 13 decisions D-04 / D-05).
    - name: Doc style audit (numpydoc — warning only, blocking from v1.2.0)
      if: matrix.python-version == '3.13'
      continue-on-error: true
      run: |
        FILES=$(find ketu -name "*.py" \
            ! -path "*/__pycache__/*" \
            ! -name "lunar_calendar.py" \
            ! -name "_*.py")
        echo "Validating $(echo "$FILES" | wc -l) files..."
        python -m numpydoc lint $FILES

    - name: Upload coverage reports to Codecov
      if: matrix.python-version == '3.13'
      uses: codecov/codecov-action@v5
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
