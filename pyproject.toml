[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ketu"
version = "1.1.0"
description = "Library to compute astronomical bodies positions and planetary aspects between them"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Loc Cosnier", email = "loc.cosnier@pm.me"}
]
keywords = [
    "astrology",
    "astronomy",
    "ephemeris",
    "aspects",
    "planets",
    "zodiac",
    "numpy"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.20.0",
]

[project.optional-dependencies]
test = [
    "pysweph>=2.10.3.6",
]
dev = [
    "interrogate>=1.7.0",
    "numpydoc>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/alkimya/ketu"
Documentation = "https://ketu.readthedocs.io"
Repository = "https://github.com/alkimya/ketu"
Issues = "https://github.com/alkimya/ketu/issues"
Changelog = "https://github.com/alkimya/ketu/blob/main/CHANGELOG.md"

[project.scripts]
ketu = "ketu.cli:main"

[tool.setuptools]
packages = ["ketu", "ketu.ephemeris", "ketu.aspects", "ketu.cycles", "ketu.cache", "ketu.houses", "ketu.cli"]

[tool.setuptools.package-data]
ketu = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
# Project-wide coverage report on every pytest run. NOTE: do NOT add
# --cov-fail-under here — that would block partial test runs (e.g.
# pytest tests/test_ephemeris.py) that don't exercise enough of the
# codebase to hit the threshold. The HOU-09 95% gate scoped to
# ketu.houses lives in the Makefile target `make houses-coverage`.
addopts = "-v --cov=ketu --cov-report=term-missing"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "houses_coverage_gate: HOU-09 95% coverage gate for ketu.houses (run via Makefile target `make houses-coverage`)",
]

[tool.coverage.run]
source = ["ketu"]
omit = [
    "*/tests/*",
    "ketu/__main__.py",
    "ketu/lunar_calendar.py",
]

[tool.coverage.report]
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.interrogate]
fail-under = 95
exclude = [
    "ketu/lunar_calendar.py",
    "tests",
    "build",
    "docs",
]
ignore-init-method = true
ignore-magic = true
ignore-nested-functions = true
ignore-private = false
ignore-semiprivate = false
verbose = 1
style = "sphinx"

[tool.numpydoc_validation]
checks = [
    "all",   # report every check
    "EX01",  # ignore: no examples section required (internal helpers)
    "SA01",  # ignore: no See Also required
    "ES01",  # ignore: no extended summary required
    "GL01",  # ignore during warning phase (Phase 13–19); fix and remove in Phase 20
]
exclude = [
    '\.lunar_calendar$',
    '\._',
]
override_SS05 = [
    '^Aspect$',
    '^ZodiacPoint$',
    '^CycleRatio$',
]

# CI: pip install mypy numpy
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["swisseph.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "ketu.calculations",
    "ketu.complex",
    "ketu.cycles.*",
    "ketu.ephemeris.*",
    "ketu.aspects.*",
    "ketu.lunar_calendar",
    "ketu.cache.ephemeris_cache",
]
disable_error_code = ["misc", "no-untyped-def", "no-untyped-call", "arg-type", "return-value", "assignment", "operator", "union-attr", "no-any-return", "type-arg", "var-annotated", "unused-ignore", "index"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
