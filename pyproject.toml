[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ketu"
version = "1.2.0"
description = "Library to compute astronomical bodies positions and planetary aspects between them"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Loc Cosnier", email = "loc.cosnier@pm.me"}
]
keywords = [
    "astrology",
    "astronomy",
    "ephemeris",
    "aspects",
    "planets",
    "zodiac",
    "numpy"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.20.0",
]

[project.optional-dependencies]
test = [
    "pyswisseph>=2.10.0",
]
dev = [
    "interrogate>=1.7.0",
    "numpydoc>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/alkimya/ketu"
Documentation = "https://ketu.readthedocs.io"
Repository = "https://github.com/alkimya/ketu"
Issues = "https://github.com/alkimya/ketu/issues"
Changelog = "https://github.com/alkimya/ketu/blob/main/CHANGELOG.md"

[project.scripts]
ketu = "ketu.cli:main"

[tool.setuptools]
packages = ["ketu", "ketu.ephemeris", "ketu.aspects", "ketu.cycles", "ketu.cache", "ketu.houses", "ketu.charts", "ketu.cli", "ketu.synastry", "ketu.composite", "ketu.returns", "ketu.parts", "ketu.data"]

[tool.setuptools.package-data]
ketu = ["py.typed"]
"ketu.data" = ["*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
# Project-wide coverage report on every pytest run. NOTE: do NOT add
# --cov-fail-under here — that would block partial test runs (e.g.
# pytest tests/test_ephemeris.py) that don't exercise enough of the
# codebase to hit the threshold. The HOU-09 95% gate scoped to
# ketu.houses lives in the Makefile target `make houses-coverage`.
addopts = "-v --cov=ketu --cov-report=term-missing"
# ELLIPSIS + NORMALIZE_WHITESPACE for --doctest-modules runs (make doctest / CI).
# These flags apply to the separate doctest invocation only — do NOT add
# --doctest-modules to addopts (that would break partial test runs).
doctest_optionflags = ["ELLIPSIS", "NORMALIZE_WHITESPACE"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "charts_coverage_gate: CHART-05 95% coverage gate for ketu.charts (run via Makefile target `make charts-coverage`)",
    "composite_coverage_gate: COMP-05 95% coverage gate for ketu.composite (run via Makefile target `make composite-coverage`)",
    "houses_coverage_gate: HOU-09 95% coverage gate for ketu.houses (run via Makefile target `make houses-coverage`)",
    "parts_coverage_gate: PARTS coverage gate (>=95%) for ketu.parts (run via Makefile target `make parts-coverage`)",
    "returns_coverage_gate: RET-06 95% coverage gate for ketu.returns (run via Makefile target `make returns-coverage`)",
    "synastry_coverage_gate: SYN-05 95% coverage gate for ketu.synastry (run via Makefile target `make synastry-coverage`)",
]

[tool.coverage.run]
source = ["ketu"]
omit = [
    "*/tests/*",
    "ketu/__main__.py",
    "ketu/lunar_calendar.py",
]

[tool.coverage.report]
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    # Runtime-unreachable: TYPE_CHECKING is always False at runtime
    "if TYPE_CHECKING:",
    # Runtime-unreachable defensive branches: Python modulo (%) never
    # produces a negative result, so these post-modulo < 0 guards are
    # proven dead code (documented in Phase 21 decision log).
    "if angle < 0:",
    "if gst < 0:",
    # Runtime-unreachable: avg_speed is sourced from a dict of positive
    # constants; zero is structurally impossible at this call site.
    "if avg_speed == 0:",
    # Runtime-unreachable: the binary-search fallback return after
    # max_iterations (50) is never reached in normal planetary motion
    # because the search always converges within tolerance first.
    "return \\(jd_left \\+ jd_right\\) / 2",
]

[tool.interrogate]
fail-under = 95
exclude = [
    "ketu/lunar_calendar.py",
    "tests",
    "build",
    "docs",
]
ignore-init-method = true
ignore-magic = true
ignore-nested-functions = true
ignore-private = false
ignore-semiprivate = false
verbose = 1
style = "sphinx"

[tool.numpydoc_validation]
checks = [
    "all",   # report every check
    "EX01",  # ignore: no examples section required (internal helpers)
    "SA01",  # ignore: no See Also required
    "ES01",  # ignore: no extended summary required
]
exclude = [
    '\.lunar_calendar$',
    '\._',
]
override_SS05 = [
    '^Aspect$',
    '^ZodiacPoint$',
    '^CycleRatio$',
]

# CI: pip install mypy numpy
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["swisseph.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "ketu.calculations",
    "ketu.complex",
    "ketu.cycles.*",
    "ketu.ephemeris.*",
    "ketu.aspects.*",
    "ketu.lunar_calendar",
    "ketu.cache.ephemeris_cache",
]
disable_error_code = ["misc", "no-untyped-def", "no-untyped-call", "arg-type", "return-value", "assignment", "operator", "union-attr", "no-any-return", "type-arg", "var-annotated", "unused-ignore", "index"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
