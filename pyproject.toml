[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ketu"
version = "0.4.0"
description = "Library to compute astronomical bodies positions and planetary aspects between them"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Loc Cosnier", email = "loc.cosnier@pm.me"}
]
keywords = [
    "astrology",
    "astronomy",
    "ephemeris",
    "aspects",
    "planets",
    "zodiac",
    "numpy"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=1.20.0",
]

[project.urls]
Homepage = "https://github.com/alkimya/ketu"
Documentation = "https://ketu.readthedocs.io"
Repository = "https://github.com/alkimya/ketu"
Issues = "https://github.com/alkimya/ketu/issues"

[project.scripts]
ketu = "ketu.display:main"

[tool.setuptools]
packages = ["ketu", "ketu.ephemeris", "ketu.aspects", "ketu.cycles", "ketu.cache"]

[tool.setuptools.package-data]
ketu = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=ketu --cov-report=term-missing"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["ketu"]
omit = [
    "*/tests/*",
    "ketu/export/*",
    "ketu/__main__.py",
    "ketu/resonance.py",
    "ketu/lunar_calendar.py",
]

[tool.coverage.report]
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# CI: pip install mypy numpy
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["swisseph.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "ketu.export.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "ketu.calculations",
    "ketu.complex",
    "ketu.cycles.*",
    "ketu.ephemeris.*",
    "ketu.aspects.*",
    "ketu.resonance",
    "ketu.lunar_calendar",
    "ketu.cache.ephemeris_cache",
]
disable_error_code = ["misc", "no-untyped-def", "no-untyped-call", "arg-type", "return-value", "assignment", "operator", "union-attr", "no-any-return", "type-arg", "var-annotated", "unused-ignore", "index"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
