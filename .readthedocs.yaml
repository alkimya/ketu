# Configuration ReadTheDocs
# Documentation : https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

# Build documentation in the docs/ directory with Sphinx
build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  jobs:
    post_checkout:
      # Télécharge et installe les éphémérides Swiss Ephemeris si nécessaire
      - mkdir -p $HOME/.swe_files
    post_install:
      # Install project dependencies
      - pip install -e .
    post_build:
      # Build French documentation as well
      - mkdir -p ${READTHEDOCS_OUTPUT:-_readthedocs/html}/fr
      - sphinx-build -b html docs/fr ${READTHEDOCS_OUTPUT:-_readthedocs/html}/fr

# Configuration Sphinx
# English documentation is the primary version
# French documentation is available in docs/fr/
sphinx:
  builder: html
  configuration: docs/en/conf.py
  fail_on_warning: false

# Formats de sortie supplémentaires
formats:
  - pdf
  - epub

# Configuration Python
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
    - requirements: docs/requirements-docs.txt
